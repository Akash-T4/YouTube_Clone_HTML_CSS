<!doctype html>
<html>
  <head>
    <title>YouTube Clone</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles/general.css" />
    <link rel="stylesheet" href="styles/header.css" />
    <link rel="stylesheet" href="styles/body.css" />
    <link rel="stylesheet" href="styles/nav.css" />
  </head>
  <body>
    <header class="youtube-clone-header-section">
      <div class="youtube-clone-header-left-section">
        <img
          class="youtube-clone-hamburger-menu-icon"
          src="Icons/hamburger-menu.svg"
        />
        <a href="https://www.youtube.com/" target="_blank">
          <img
            class="youtube-clone-youtube-logo"
            src="Icons/youtube-logo.svg"
          />
        </a>
      </div>
      <div class="youtube-clone-header-middle-section">
        <input
          class="youtube-clone-search-box"
          type="text"
          placeholder="Search"
        />
        <button class="youtube-clone-search-btn">
          <img class="youtube-clone-search-icon" src="Icons/search.svg" />
          <div class="tooltip">Search</div>
        </button>
        <button class="youtube-clone-voice-search-btn">
          <img
            class="youtube-clone-voice-search-icon"
            src="Icons/voice-search-icon.svg"
          />
          <div class="tooltip">Search with voice</div>
        </button>
      </div>
      <div class="youtube-clone-header-right-section">
        <div class="youtube-clone-upload-icon-container">
          <img class="youtube-clone-upload-icon" src="Icons/upload.svg" />
          <div class="tooltip">Create</div>
        </div>
        <div class="youtube-clone-youtube-apps-icon-container">
          <img
            class="youtube-clone-youtube-apps-icon"
            src="Icons/youtube-apps.svg"
          />
          <div class="tooltip">Youtube Apps</div>
        </div>

        <div class="youtube-clone-notifications-icon-container">
          <img
            class="youtube-clone-notifications-icon"
            src="Icons/notifications.svg"
          />
          <div class="youtube-clone-notifications-count">3</div>
          <div class="tooltip">Notifications</div>
        </div>
        <img
          class="youtube-clone-profile-icon"
          src="channel-icon/Akash_T_img.png"
        />
      </div>
    </header>

    <nav class="youtube-clone-nav-bar-section">
      <div class="youtube-clone-nav-bar-container">
        <img src="Icons/home.svg" />
        <div>Home</div>
      </div>
      <div class="youtube-clone-nav-bar-container">
        <img src="Icons/explore.svg" />
        <div>Explore</div>
      </div>
      <div class="youtube-clone-nav-bar-container">
        <img src="Icons/subscriptions.svg" />
        <div>Subscriptions</div>
      </div>
      <div class="youtube-clone-nav-bar-container">
        <img src="Icons/originals.svg" />
        <div>Originals</div>
      </div>
      <div class="youtube-clone-nav-bar-container">
        <img src="Icons/youtube-music.svg" />
        <div>YouTube Music</div>
      </div>
      <div class="youtube-clone-nav-bar-container">
        <img src="Icons/library.svg" />
        <div>Library</div>
      </div>
    </nav>

    <main>
      <section>
        <div
          class="youtube-clone-video-preview-grid js-youtube-clone-video-preview-grid"
        ></div>
      </section>
    </main>
  </body>

  <script src="youtube.js" type="module"></script>
</html>
